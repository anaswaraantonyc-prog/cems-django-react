<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sirenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded App Icon Surface -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Accent Border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#A7F3D0" stroke-width="6" opacity="0.45" />

  <!-- Emergency Beacon Orb at Top Right -->
  <g transform="translate(360, 56)">
    <circle cx="40" cy="40" r="42" fill="#FFFFFF" opacity="0.35" />
    <circle cx="40" cy="40" r="34" fill="url(#sirenGrad)" stroke="#FFFFFF" stroke-width="5" />
    <!-- Pulse Waves -->
    <path d="M40 18 L40 10 M56 24 L62 18 M24 24 L18 18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Central CEMS Bold 'C' Mark -->
  <path d="M 330 160
           A 135 135 0 1 0 330 352"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="54"
        stroke-linecap="round" />

  <!-- Emergency Cross in Center of 'C' -->
  <rect x="216" y="200" width="28" height="112" rx="8" fill="#FFFFFF" />
  <rect x="174" y="242" width="112" height="28" rx="8" fill="#FFFFFF" />
</svg>
